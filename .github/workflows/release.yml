name: Release

# Triggers:
#   - Pushing a tag that looks like v1.2.3 (standard SemVer)
#   - Manual dispatch from the Actions tab
#
# Why tag-triggered and not every commit:
#   - Desktop apps don't need a binary per commit — that's noise
#   - Tags give clean version numbers for users to reference
#   - Flow: merge features to main freely, run `git tag v0.2.0 && git push --tags`
#     when you actually want a release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0) — used only for manual dispatch'
        required: true
        default: '0.0.0'

permissions:
  contents: write  # needed by softprops/action-gh-release to create the release

jobs:
  build:
    name: Build Harbour.app
    runs-on: macos-14   # Apple Silicon, has Xcode 15+
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ inputs.version }}"     >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        run: swift test -c debug

      - name: Build release (universal arm64 + x86_64)
        run: ./build.sh
        env:
          CONFIG: release
          UNIVERSAL: "1"

      - name: Verify bundle
        run: |
          ls -la "build/Harbour Control.app/Contents/MacOS/"
          ls -la "build/Harbour Control.app/Contents/Resources/"
          lipo -info "build/Harbour Control.app/Contents/MacOS/Harbour"
          lipo -info "build/Harbour Control.app/Contents/Resources/harbour-daemon"
          codesign -vv "build/Harbour Control.app" || true

      - name: Create zip
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent "Harbour Control.app" "Harbour-Control-${{ steps.version.outputs.version }}.zip"
          ls -la *.zip

      - name: Create DMG
        run: |
          cd build
          hdiutil create -volname "Harbour Control" \
                         -srcfolder "Harbour Control.app" \
                         -ov -format UDZO \
                         "Harbour-Control-${{ steps.version.outputs.version }}.dmg"
          ls -la *.dmg

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Harbour-Control-${{ steps.version.outputs.version }}
          path: |
            build/*.zip
            build/*.dmg
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Harbour Control ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            build/*.zip
            build/*.dmg
          body: |
            ## Install

            **Universal build** — runs on Apple Silicon (M1/M2/M3/M4) and Intel Macs.

            1. Download the `.dmg` below
            2. Open it and drag **Harbour Control.app** to your Applications folder
            3. First launch: right-click the app → **Open** → **Open** (macOS Gatekeeper refuses unsigned apps otherwise). Or run once: `xattr -cr "/Applications/Harbour Control.app"`

            ## Requirements

            macOS 13 Ventura or later. Admin password needed once per block to install the background enforcer.

            ## Changes

            See commit history for this release below.
